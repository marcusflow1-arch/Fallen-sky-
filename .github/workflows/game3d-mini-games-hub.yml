name: Game 3D Mini Games Hub
on:
  pull_request:
    paths:
      - 'base44/shared/game3dMiniGameCatalog.mjs'
      - 'base44/entities/Game3DMiniEvent.jsonc'
      - 'base44/entities/Game3DMiniRSVP.jsonc'
      - 'base44/functions/game3dMiniGames/entry.ts'
      - 'src/components/game3d/minigames/**'
      - 'src/pages/GameView.jsx'
      - 'tests/game3d-mini-games-hub.test.mjs'
      - '.github/workflows/game3d-mini-games-hub.yml'
  push:
    paths:
      - 'base44/shared/game3dMiniGameCatalog.mjs'
      - 'base44/entities/Game3DMiniEvent.jsonc'
      - 'base44/entities/Game3DMiniRSVP.jsonc'
      - 'base44/functions/game3dMiniGames/entry.ts'
      - 'src/components/game3d/minigames/**'
      - 'src/pages/GameView.jsx'
      - 'tests/game3d-mini-games-hub.test.mjs'
permissions:
  contents: read
jobs:
  mini-games-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate event rules, UI wiring and server permissions
        run: node --test tests/game3d-mini-games-hub.test.mjs
